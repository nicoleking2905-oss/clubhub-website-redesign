<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your club · ClubHub</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Outfit:wght@800&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<link rel="stylesheet" href="css/styles.css">
<script src="js/create-your-club.js" defer></script>
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <defs><mask id="ch-mark-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><path d="M71.52 45.43 A22 22 0 1 0 71.52 54.57" fill="none" stroke="#000" stroke-width="18"/></mask></defs>
  <symbol id="ch-mark" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" mask="url(#ch-mark-mask)"/></symbol>
</svg>

<div class="page page--full">

<header class="site-header">
  <a class="brand" href="index.html">
    <svg class="brand-mark" viewBox="0 0 100 100" width="40" height="40" role="img" aria-label="ClubHub"><use href="#ch-mark" fill="#1F7A70"/></svg>
    <span class="brand-name">ClubHub</span>
  </a>
  <nav class="site-nav" aria-label="Main">
    <a class="nav-plain" href="index.html#pricing">Pricing</a>
    <a class="nav-strong" href="sign-in.html">Sign in</a>
  </nav>
</header>

<main class="create-main" data-hero>
  <div class="create-bg" aria-hidden="true" data-bg></div>
  <div class="create-tint" aria-hidden="true"></div>
  <div class="create-inner">
    <div class="create-head">
      <h1 class="display h1-create">Create your club in under a minute</h1>
      <p class="create-sub">Just enter a few details below and begin to manage your club in the way you've always dreamed</p>
    </div>

    <form class="create-form" novalidate>
      <label class="field">
        <span class="field-label">Club Name*</span>
        <input class="input" type="text" name="clubName" placeholder="e.g. Northgate FC" autocomplete="organization">
        <span class="field-error" data-error="clubName" role="alert" hidden>Please enter your club's name</span>
      </label>
      <label class="field">
        <span class="field-label">Activity*</span>
        <span class="select-wrap">
          <select class="input" name="activity">
            <option value="">Choose an activity</option>
            <option value="football">Football</option>
          </select>
          <svg viewBox="0 0 12 8" width="14" height="10" aria-hidden="true"><path d="M1 1.5 L6 6.5 L11 1.5" fill="none" stroke="#10231F" stroke-width="2"/></svg>
        </span>
        <span class="field-error" data-error="activity" role="alert" hidden>Please choose an activity</span>
      </label>
      <button class="btn-submit lift" type="submit">Create My Club</button>
      <p class="create-price">£9.99 a month, flat. No per-player fees.</p>
    </form>

    <a class="demo-link" href="https://clubhubspace.com/demo/club-index">Not sure yet? Try our demo site</a>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-brand">
    <svg class="brand-mark" viewBox="0 0 100 100" width="28" height="28" role="img" aria-label="ClubHub"><use href="#ch-mark" fill="#5FC2B4"/></svg>
    <span>© 2026 ClubHub</span>
  </div>
  <div class="footer-links">
    <a class="footer-ig" href="https://www.instagram.com/clubhubspace" target="_blank" rel="noopener" aria-label="ClubHub on Instagram" title="Instagram"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg></a>
    <a href="privacy.html">Privacy</a>
    <a href="mailto:clubhub@clubhubspace.com">Contact</a>
  </div>
</footer>

</div>
</body>
</html>
